<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>よいまつり横丁 第2章 月見座</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#16111f; --panel:#251d36; --panel2:#1c1629; --edge:#0b0812; --rim:#41345e; --ink:#f3e9d2; --mute:#b0a3c8; --dim:#7a6e94;
  --red:#d8433b; --red2:#a32f28; --gold:#f2c14e; --gold2:#b8862a; --good:#7ccf62; --bad:#ff7a6b; --blue:#5ab0e8; --cell:#2c2342;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--bg);
  background-image:radial-gradient(#ffffff1a 1px, transparent 1.5px),radial-gradient(#ffd8801a 1px, transparent 1.5px);
  background-size:46px 46px, 73px 73px; background-position:0 0, 21px 13px;
  color:var(--ink); font-family:'DotGothic16',monospace; min-height:100vh; letter-spacing:.02em;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation; user-select:none; -webkit-user-select:none;
  padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation;letter-spacing:inherit}
.wrap{max-width:500px;margin:0 auto;padding:6px 10px 24px}
.hidden{display:none!important}
.spr{display:inline-block;width:1.3em;height:1.3em;vertical-align:-.3em;background-image:var(--sheet);background-repeat:no-repeat;background-size:1600% 1100%;image-rendering:pixelated;font-style:normal}
.px{border:3px solid var(--edge);box-shadow:inset 0 0 0 2px var(--rim);background:var(--panel)}
.btn{border:3px solid var(--edge);padding:11px 8px;font-size:16px;background:var(--cell);box-shadow:inset 0 -4px 0 #0007,inset 0 0 0 2px var(--rim)}
.btn:active{transform:translateY(2px)}
.btn.red{background:var(--red);color:#fff;box-shadow:inset 0 -5px 0 var(--red2),inset 0 3px 0 #ff8a70}
.btn.gold{background:var(--gold);color:#2a1a08;box-shadow:inset 0 -5px 0 var(--gold2),inset 0 3px 0 #ffe9a8}
.btn.blue{background:#3a6fb0;color:#fff;box-shadow:inset 0 -5px 0 #24497a,inset 0 3px 0 #7fb6ef}
.btn:disabled{opacity:.4;transform:none}
.btn small{display:block;font-size:11px;opacity:.85}
.wide{width:100%;display:block}
.lanterns{display:flex;justify-content:space-between;font-size:16px;margin:2px -4px 0;filter:drop-shadow(0 0 6px #ff6a3d66)}
.lanterns span:nth-child(odd){transform:translateY(4px)}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes fade{from{opacity:0}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}

/* タイトル */
.logo .series{font-size:15px;color:#ffe2a8;letter-spacing:.3em;margin-bottom:10px;text-shadow:2px 2px 0 #0b0812}
.titlebg{position:fixed;inset:0;z-index:-1;background:url(bg/tsukimiza_out.jpg) center top/cover;opacity:.42}
.titlebg::after{content:"";position:absolute;inset:0;background:linear-gradient(#16111f00 30%,#16111fee 75%)}
.logo{text-align:center;margin:26px 0 6px}
.logo .big{font-size:44px;line-height:1.1;color:#ffe2a8;text-shadow:4px 4px 0 #a32f28, 8px 8px 0 #0b0812}
.logo .sub{color:var(--mute);font-size:13px;letter-spacing:.18em;margin-top:14px}
.title-items{display:flex;justify-content:center;gap:10px;margin:24px 0 20px;font-size:44px}
.title-items .spr{animation:bob 2.4s infinite steps(4)}
.title-items .spr:nth-child(2){animation-delay:-.6s}.title-items .spr:nth-child(3){animation-delay:-1.2s}.title-items .spr:nth-child(4){animation-delay:-1.8s}
.best{text-align:center;color:var(--gold);font-size:13px;margin:10px 0}
.note{color:var(--dim);font-size:11px;text-align:center;margin-top:18px;line-height:1.6}
.row2{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:12px}

/* 会話 */
.talk{position:fixed;inset:0;z-index:40;background:#0b0812cc;display:flex;flex-direction:column;justify-content:flex-end;animation:fade .2s}
.talk .box{max-width:500px;width:100%;margin:0 auto;padding:0 10px calc(16px + env(safe-area-inset-bottom))}
.talk .face{width:132px;height:132px;border:3px solid var(--edge);box-shadow:inset 0 0 0 2px var(--rim);background:var(--panel2);display:block;margin-left:6px}
.talk .msg{position:relative;margin-top:-3px;padding:12px 14px 22px;min-height:104px;font-size:16px;line-height:1.7}
.talk .nm{font-size:14px;margin-bottom:4px}
.talk .tap{position:absolute;right:10px;bottom:6px;font-size:11px;color:var(--dim);animation:bob 1.2s infinite steps(2)}

/* 相手の紹介 */
.vs{text-align:center;padding-top:16px}
.vs .night{color:var(--mute);font-size:14px;letter-spacing:.2em}
.vs .portrait{width:150px;height:150px;margin:12px auto;display:grid;place-items:center}
.vs .portrait img{width:100%;height:100%}
.vs .oname{font-size:26px;color:#ffe2a8}
.vs .line{margin:10px 8px 0;font-size:15px;line-height:1.6;min-height:3em}
.vs .tgt{margin:14px 0 4px;font-size:15px;color:var(--mute)}
.vs .tgt b{font-size:30px;color:var(--gold);font-weight:normal}
.rule{display:inline-block;margin:8px 0;padding:6px 10px;border:2px solid var(--bad);color:var(--bad);font-size:13px;line-height:1.5;background:#3a1520}

/* 対局 */
.hud{display:flex;gap:8px;align-items:stretch}
.opp{flex:0 0 auto;display:flex;gap:6px;align-items:center;padding:4px 8px 4px 4px}
.opp .of{width:42px;height:42px;display:grid;place-items:center;background:var(--panel2);border:2px solid var(--edge)}
.opp .of img{width:100%;height:100%}
.opp .on{font-size:13px;line-height:1.25}
.opp .on small{display:block;color:var(--mute);font-size:11px}
.goal{flex:1;padding:5px 8px;display:flex;flex-direction:column;justify-content:center}
.goal .row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--mute)}
.goal .row b{font-weight:normal;font-size:20px;color:var(--ink)}
.goal .row .t{color:var(--gold);font-size:14px}
.bar{height:8px;background:var(--edge);margin-top:4px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .4s}
.rulebar{margin-top:5px;font-size:12px;color:var(--bad);text-align:center;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:5px}
.stat{padding:3px 2px;text-align:center;font-size:11px;color:var(--mute)}
.stat b{display:block;font-weight:normal;font-size:18px;color:var(--ink)}
.stat.h b{color:var(--blue)} .stat.m b{color:var(--gold)}
.boardwrap{position:relative;margin-top:6px;border:3px solid var(--edge);box-shadow:0 0 0 2px #b8862a,0 6px 0 #0008;background:#2a1530;line-height:0}
canvas.board{width:100%;display:block;touch-action:none}
.hint{position:absolute;left:0;right:0;top:6px;text-align:center;font-size:12px;color:#ffe2a8;line-height:1.4;pointer-events:none;text-shadow:1px 1px 0 #000}
.calc{display:flex;align-items:center;justify-content:center;gap:5px;font-size:17px;margin-top:8px;flex-wrap:wrap}
.calc .box{min-width:64px;text-align:center;padding:3px 6px;border:3px solid var(--edge);color:#fff}
.calc .mon{background:#2f6fb0}.calc .mul{background:var(--red)}.calc .pk{background:#8a5a10}
.calc .x{color:var(--mute)}
.calc .tot{font-size:22px;color:#ffe2a8;min-width:70px;text-align:left}
.calc .tot.pop{animation:pop .4s}
.calc .lbl{display:block;font-size:9px;opacity:.8;line-height:1}
.speed{margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.speed .btn{font-size:13px;padding:8px 4px}

/* 下から出るシート */
.sheet{position:fixed;inset:0;z-index:30;background:#0b0812b0;display:flex;align-items:flex-end;animation:fade .15s}
.sheet .in{max-width:500px;width:100%;margin:0 auto;max-height:86vh;overflow:auto;padding:14px 14px calc(16px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 10px;font-weight:normal;color:var(--gold);font-size:17px}

/* 勝ち・屋台 */
.res h2,.shop h2{font-weight:normal;text-align:center;font-size:28px;color:#ffe2a8;text-shadow:3px 3px 0 #a32f28;margin:14px 0 8px}
.pay{padding:10px 14px;margin:10px 0;font-size:15px}
.pay div{display:flex;justify-content:space-between;padding:4px 0}
.pay div b{font-weight:normal;color:var(--gold)}
.pay .sum{border-top:2px solid var(--rim);margin-top:6px;padding-top:8px;font-size:18px}
.keeper{display:flex;gap:10px;align-items:flex-start;margin:8px 0 10px}
.keeper img{width:56px;height:56px;border:2px solid var(--edge);flex:0 0 auto}
.keeper .say{flex:1;padding:8px 10px;font-size:14px;line-height:1.6}
.wallet{text-align:right;color:var(--gold);font-size:16px;margin:4px 2px}
.item{display:flex;gap:10px;align-items:center;padding:8px 10px;margin-bottom:7px}
.item .ic{width:48px;height:48px;flex:0 0 auto;display:grid;place-items:center;background:var(--cell);border:2px solid var(--edge)}
.item .tx{flex:1;font-size:12px;line-height:1.5;color:var(--mute)}
.item .tx b{display:block;font-weight:normal;font-size:15px;color:var(--ink)}
.item .btn{font-size:14px;padding:9px 8px;flex:0 0 auto;min-width:72px}
.item.sold{opacity:.35}
.sec{font-size:13px;color:var(--gold);margin:12px 2px 6px;line-height:1.5}
.sec small{color:var(--mute);font-size:11px;display:block}
.tray{display:flex;flex-wrap:wrap;gap:6px;min-height:58px;padding:6px}
.tray .ti{width:50px;height:50px;display:grid;place-items:center;background:var(--cell);border:3px solid var(--edge);padding:0}
.tray .ti.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold);transform:translateY(-3px)}
.tray .none{color:var(--dim);font-size:12px;align-self:center;padding-left:4px}

/* 負け */
.over{text-align:center}
.over .rec{margin:14px 0;padding:14px;font-size:15px;line-height:1.9}
.over .rec b{color:var(--gold);font-weight:normal;font-size:22px}
.xpost{display:block;text-decoration:none;text-align:center;margin-top:10px}

/* 会話（背景つき） */
.talk{background:#0b0812}
.talk .bgimg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.55;transition:opacity .3s}
.talk .box{position:relative}
.talk .skip{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:2;font-size:12px;padding:6px 10px;background:#0008;border:2px solid var(--rim);color:var(--mute)}
.talk .ttl{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:24px;color:#ffe2a8;text-shadow:3px 3px 0 #a32f28,5px 5px 0 #0b0812;animation:fade .6s;letter-spacing:.1em}
.talk .msg.narr{min-height:90px;color:#e2d8f2}
.talk .moonfx{position:absolute;left:50%;top:12%;width:120px;height:120px;margin-left:-60px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fffbe6,#ffe9a8 60%,#f2c14e);box-shadow:0 0 60px #ffe9a8aa;animation:pop 1.4s}
/* 挿絵 */
.talk .bgimg.cg{opacity:1;background-position:center top}
.talk .bgimg.cg::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(#0b081200,#0b0812cc)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gi{position:relative;aspect-ratio:9/16;padding:0;border:2px solid var(--edge);background:var(--cell);overflow:hidden}
.gi img{width:100%;height:100%;object-fit:cover;display:block}
.gi span{position:absolute;left:0;right:0;bottom:0;font-size:10px;line-height:1.3;padding:3px;background:#0b0812cc;color:var(--ink)}
.gi.lock{display:grid;place-items:center;opacity:.5}
.gi.lock span{position:static;background:none;color:var(--dim)}
.cgview{position:fixed;inset:0;z-index:50;background:#000;display:grid;place-items:center;animation:fade .2s}
.cgview img{max-width:100%;max-height:100%;object-fit:contain}
/* 大当たり */
.jackpot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;background:radial-gradient(circle,#f2c14e55,#f2c14e00 70%);animation:fade .15s}
.jackpot .in{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 26px;background:#0b0812d9;border:3px solid #f2c14e;box-shadow:0 0 24px #f2c14e88;animation:pop .45s}
.jackpot b{display:block;font-weight:normal;font-size:40px;line-height:1.1;color:#fff3c4;text-shadow:3px 3px 0 #a32f28}
.jackpot span{display:block;font-size:30px;line-height:1.1;color:#ffe2a8}
/* 月 */
.moon{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0 2px;font-size:13px;color:var(--mute)}
.moon svg{width:26px;height:26px}
/* 役物えらび */
.draft{position:fixed;left:0;right:0;bottom:0;z-index:20;animation:fade .2s}
.draft .in{max-width:500px;margin:0 auto;padding:10px 10px calc(12px + env(safe-area-inset-bottom));border-bottom:none}
.draft h4{margin:0 0 8px;font-weight:normal;font-size:14px;color:var(--gold);text-align:center}
.draft .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.opt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;background:var(--cell);border:3px solid var(--edge);box-shadow:inset 0 0 0 2px var(--rim);text-align:center}
.opt .on{font-size:13px;color:var(--ink);line-height:1.2}
.opt .od{font-size:10px;color:var(--mute);line-height:1.35}
.opt .rr{font-size:10px;padding:1px 6px;border-radius:2px}
.opt.r0 .rr{background:#41345e;color:#cfc6e2}.opt.r1 .rr{background:#2f6fb0;color:#fff}.opt.r2 .rr{background:#b8862a;color:#fff}
.opt.r2{box-shadow:inset 0 0 0 2px #f2c14e}
.draft .skipb{margin-top:8px;width:100%;font-size:13px;padding:8px}
.placebar{display:flex;gap:6px;margin-top:8px}
.placebar .btn{flex:1;font-size:13px;padding:8px}
.nameform input{width:100%;font-family:inherit;font-size:18px;padding:10px;border:3px solid var(--edge);background:var(--cell);color:var(--ink);margin:8px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="lanterns"><span>🏮</span><span>🏮</span><span>🏮</span><span>🏮</span><span>🏮</span><span>🏮</span><span>🏮</span></div>

  <section id="s-title">
    <div class="titlebg"></div>
    <div class="logo"><div class="series">よいまつり横丁　第2章</div><div class="big">月見座</div><div class="sub">十五夜に、大台をまわせ</div></div>
    <div class="title-items" id="titleItems"></div>
    <div class="best" id="bestRec"></div>
    <button class="btn red wide" id="bStart">はじめる</button>
    <div class="row2"><button class="btn" id="bHow">あそびかた</button><button class="btn" id="bListT">役物の一覧</button></div>
    <button class="btn wide hidden" id="bEndless" style="margin-top:8px">エンドレス（ストーリーをとばす）</button>
    <div class="row2" style="grid-template-columns:1fr 1fr;margin-top:8px"><button class="btn hidden" id="bGallery" style="font-size:13px;padding:8px">挿絵</button><button class="btn" id="bName" style="font-size:13px;padding:8px">名前を変える</button></div>
    <div class="note">試作版：序章＋全5話＋エピローグ（『ヤチンスピン』のつづき）<br>新キャラ：ギンコ・テツ・ウヅキ・アオ</div>
  </section>

  <section id="s-vs" class="hidden vs">
    <div class="night" id="vsNight"></div>
    <div class="moon" id="vsMoon"></div>
    <div class="portrait px" id="vsFace"></div>
    <div class="oname" id="vsName"></div>
    <div id="vsRule"></div>
    <div class="line" id="vsLine"></div>
    <div class="tgt">ためる縁 <b id="vsTgt"></b> 点</div>
    <button class="btn red wide" id="bFight" style="margin-top:12px">打ちはじめる</button>
  </section>

  <section id="s-play" class="hidden">
    <div class="hud">
      <div class="opp px"><div class="of" id="pFace"></div><div class="on"><span id="pName"></span><small id="pNight"></small></div></div>
      <div class="goal px">
        <div class="row"><span>得点 <b id="pScore">0</b></span><span>目標 <span class="t" id="pTgt"></span></span></div>
        <div class="bar"><i id="pBar" style="width:0"></i></div>
      </div>
    </div>
    <div class="rulebar hidden" id="pRule"></div>
    <div class="stats">
      <div class="stat px h">手玉<b id="pBalls"></b></div>
      <div class="stat px m">縁銭<b id="pMoney"></b></div>
      <button class="stat px" id="bList">役物<b style="font-size:14px;margin-top:3px">一覧</b></button>
      <button class="stat px" id="bSpeed">速さ<b style="font-size:14px;margin-top:3px" id="speedLbl">ふつう</b></button>
    </div>
    <div class="boardwrap"><canvas class="board" id="cv"></canvas><div class="hint" id="hint">盤をさわって、落とす位置を決める<br>指をはなすと玉が出る</div></div>
    <div class="placebar hidden" id="placeBar"><button class="btn" id="bRepick">えらびなおす</button></div>
    <div class="calc">
      <div class="box mon"><span class="lbl">文</span><span id="cMon">0</span></div><span class="x">×</span>
      <div class="box mul"><span class="lbl">倍率</span><span id="cMul">1</span></div><span class="x">×</span>
      <div class="box pk"><span class="lbl">入賞</span><span id="cPk">-</span></div><span class="x">=</span>
      <span class="tot" id="cTot">0</span>
    </div>
  </section>

  <section id="s-res" class="hidden res">
    <h2>縁がたまった！</h2>
    <div class="pay px" id="payList"></div>
    <button class="btn gold wide" id="bToShop">藁人の屋台へ</button>
  </section>

  <section id="s-shop" class="hidden shop">
    <h2>藁人の屋台</h2>
    <div class="keeper"><img id="shopFace" alt=""><div class="say px" id="shopSay"></div></div>
    <div class="wallet">縁銭 <span id="shopMoney"></span></div>
    <div id="shopItems"></div>
    <div class="row2" style="margin-top:4px"><button class="btn" id="bReroll"></button><button class="btn red" id="bNext">次へ</button></div>
    <div class="sec">盤に置く<small>手持ちの役物をえらんでから、盤の釘をタップ。置いてある役物をタップすると、はずしたり売ったりできます</small></div>
    <div class="tray px" id="tray"></div>
    <div class="boardwrap" style="margin-top:8px"><canvas class="board" id="cvShop"></canvas></div>
  </section>

  <section id="s-over" class="hidden over">
    <div class="logo"><div class="big" style="font-size:34px">縁が足りない……</div></div>
    <div class="rec px" id="overRec"></div>
    <a class="btn blue xpost" id="xPost" target="_blank" rel="noopener">𝕏 に記録をポスト</a>
    <button class="btn red wide" id="bRetry" style="margin-top:10px">もう一度</button>
    <button class="btn wide" id="bTitle" style="margin-top:8px">タイトルへ</button>
  </section>
</div>
<div id="layer"></div>

<script>
/*__ENGINE__*/
</script>
<script>
/*__STORY__*/
</script>
<script>
/*__MAIN__*/
</script>
</body>
